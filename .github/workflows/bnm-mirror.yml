name: BNM — oglinda cursului oficial

# De ce există: din 25.09.2026 bnm.md nu mai răspunde cererilor venite din runtime-ul Vercel
# (conexiunea expiră fără răspuns; aceleași URL-uri merg instant dintr-o rețea obișnuită).
# Aplicația are o oglindă locală a cursului (`bnm_rates`) și se descurcă fără BNM, dar fără
# cineva care s-o alimenteze ar rămâne pe ultimul curs știut. Runner-ul GitHub e o rețea
# diferită de cea a funcției — pasul „sondă" de mai jos verifică, la fiecare rulare, dacă de
# aici chiar se ajunge la BNM, ca să nu raportăm „sincronizat" când de fapt n-am descărcat nimic.
on:
  schedule:
    # 06:20 UTC = 09:20 Chișinău — BNM publică cursul zilei dimineața.
    - cron: "20 6 * * *"
  workflow_dispatch: {}

concurrency:
  group: bnm-mirror
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sondă — se ajunge la bnm.md de pe runner?
        id: probe
        run: |
          for host in "https://www.bnm.md/ro/official_exchange_rates?get_xml=1&date=$(date -u +%d.%m.%Y)" \
                      "https://www.bnm.md/ro/export-official-exchange-rates?date=$(date -u +%d.%m.%Y)"; do
            code=$(curl -sS -m 25 -o /tmp/probe.out -w "%{http_code}" "$host" || echo "000")
            echo "→ $code  $host"
            echo "   $(head -c 160 /tmp/probe.out | tr '\n' ' ')"
          done
